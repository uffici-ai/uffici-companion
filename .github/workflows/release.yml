# The companion's release — built HERE, in the public repository, from the tag.
#
# 🔴 Deliberately not in the platform repository: the companion holds the
# customer's agent key, and a binary whose build a customer can read, rerun and
# verify against this repository's identity is the point of open-sourcing it.
# This workflow carries no secret beyond the repository's own token: the
# signature is keyless (Sigstore, this run's OIDC identity), the provenance is
# GitHub's attestation, the image goes to this repository's own package.
#
# What it publishes for a tag `vX.Y.Z`:
#   - uffici_linux_amd64.tar.gz, uffici_linux_arm64.tar.gz, uffici_darwin_arm64.tar.gz
#     (the three supported targets; the names carry no version so
#     `releases/latest/download/<name>` always resolves — install.sh depends on it)
#   - checksums.txt, a .sigstore.json bundle per archive (cosign keyless), an SBOM per archive
#   - a build-provenance attestation per archive and for the image
#   - ghcr.io/uffici-ai/uffici-companion:X.Y.Z, :X, :latest — linux/amd64 and linux/arm64
name: Release

# 🔴 Tags only. A dispatch from a branch would publish `:latest` from an
# untagged commit, and a `-rc` tag must not move `:latest` either.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write      # the release and its assets
      id-token: write      # keyless signing and the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # goreleaser reads the tag
      # Pinned by SHA, like ci.yml: the toolchain IS what the build is a
      # statement about, so a floating tag would move it without a diff here.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The three tools that decide what a release IS, each pinned by SHA:
      # the release tool, the signer and the SBOM generator.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Check
        run: go vet ./... && go test ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest the archives
        # 🔴 Only once the repository is public: GitHub persists a build
        # attestation for public repositories (or a plan that includes them),
        # and a private-phase release must still complete — the checksum list
        # and the signature bundle need no such feature (#2196).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/uffici_*.tar.gz

  image:
    name: Image
    needs: binaries   # no image from a commit whose check failed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # ghcr.io/uffici-ai/uffici-companion
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/uffici-ai/uffici-companion
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
      - name: Attest the image
        # 🔴 Only once the repository is public: GitHub persists a build
        # attestation for public repositories (or a plan that includes them),
        # and a private-phase release must still complete — the checksum list
        # and the signature bundle need no such feature (#2196).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/uffici-ai/uffici-companion
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
