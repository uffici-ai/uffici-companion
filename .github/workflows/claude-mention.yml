# Mention-triggered Claude Code runner.
#
# Invocation: type `@claude <ask>` anywhere GitHub events fire — an issue,
# an issue comment, a PR review body, or a PR review comment. The action
# picks up the triggering body as the prompt and runs it in a fresh
# Claude Code session. Use this for:
#   - re-reviews after pushing a change to a PR (the convention: the author
#     mentions @claude on every push AFTER the first — see pr-workflow.md)
#   - focused follow-ups after a human flagged something
#   - one-off questions ("@claude how does X work in this file?")
#
# Paired with `claude-code-review.yml`, which auto-reviews a PR's FIRST push
# (open / ready_for_review / reopen, NOT synchronize). This file is the
# on-demand re-review for every push after that.
#
# Needs the `CLAUDE_CODE_OAUTH_TOKEN` repository secret.

name: Claude Code — @claude mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    name: Respond to @claude mention
    # Only fire when "@claude" actually appears in the triggering body —
    # each event type stores the body in a different field, hence the
    # per-event check.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      # `pull-requests: write` + `issues: write` — see the matching
      # comment in `claude-code-review.yml`. The same underlying bug
      # (GITHUB_TOKEN used for the comment-post path with read-only
      # perms) would silently swallow updates here too. Keeping both
      # workflows consistent at write-level perms.
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Claude needs this to read CI check results on PRs it's asked to review
    steps:
      # 🔴 Check out the PULL REQUEST's head, not the event's ref.
      #
      # None of this workflow's four triggers is `pull_request`, so none of them
      # resolves `github.sha` to `refs/pull/<n>/merge` the way
      # `claude-code-review.yml` gets for free — a comment event's sha is the
      # DEFAULT BRANCH's head. The action then reads every changed file from
      # that tree, so any file the PR ADDS is missing and the fetcher throws
      # (`fatal: could not open '<new file>' for reading`) before the model is
      # ever invoked. That failure is silent from the outside: the bot posts
      # "encountered an error" rather than a review.
      #
      # The two event families name the PR in different places — `issue_comment`
      # carries it under `github.event.issue` (it is an issue event that happens
      # to be about a PR), the review events carry a real
      # `github.event.pull_request`. An `issues:` trigger, and an `issue_comment`
      # on a genuine issue, have no PR at all: they fall through to `''`, which
      # actions/checkout reads as "the ref that triggered the run" — the correct
      # default there, and NOT a silent fallback, because those events have no
      # PR head to prefer.
      - name: Checkout repository at the PR head (or the event ref, off a PR)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: >-
            ${{ github.event.issue.pull_request
            && format('refs/pull/{0}/head', github.event.issue.number)
            || github.event.pull_request.number
            && format('refs/pull/{0}/head', github.event.pull_request.number)
            || '' }}

      - name: Run Claude Code — prompt comes from the triggering @claude body
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The action reads the triggering comment / review / issue body
          # as the prompt when none is provided here. That's what makes
          # the workflow "mention-driven" — the user's @claude message IS
          # the instruction.
          additional_permissions: |
            actions: read

          # Optional: restrict the tools Claude can call inside the action.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # claude_args: '--allowed-tools Bash(gh pr *)'
          claude_args: |
            --model ${{ vars.CLAUDE_CODE_MENTION_MODEL || 'claude-sonnet-5' }}

      # Retain the full Claude execution JSON (messages + tool results +
      # permission_denials + is_error/num_turns/cost) as a 7-day artifact, so
      # an @claude run can be audited after the GitHub job log drops it.
      # Mirrors the same step in claude-code-review.yml. `if: always()` so a
      # failed/cancelled run uploads too. Private repo → artifacts are
      # collaborator-only; the file may contain tool output, hence 7-day cap.
      # Name uses issue.number (set for issue_comment + issues events — a PR
      # comment also surfaces as issue.number) with a pull_request fallback,
      # plus run_id so it's unique across the non-PR event types this fires on.
      - name: Archive mention execution log
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-mention-execution-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      # Surface the operation's cost + shape as run metadata (job summary +
      # notice annotation). Mirrors the same step in claude-code-review.yml.
      # Metadata only — never fails the job.
      - name: Report run cost
        if: always() && steps.claude.outputs.execution_file != ''
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        with:
          script: |
            const fs = require('node:fs');
            const file = process.env.EXECUTION_FILE;
            if (!file || !fs.existsSync(file)) { core.info('No execution file; skipping cost report.'); return; }
            let result;
            try {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const arr = Array.isArray(data) ? data : (data.messages || [data]);
              result = [...arr].reverse().find((m) => m && m.type === 'result');
            } catch (e) { core.warning(`Could not parse execution file: ${e.message}`); return; }
            if (!result) { core.info('No result message in execution file.'); return; }
            const cost = typeof result.total_cost_usd === 'number' ? `$${result.total_cost_usd.toFixed(4)}` : 'n/a';
            const turns = result.num_turns ?? '?';
            const durS = result.duration_ms ? `${Math.round(result.duration_ms / 1000)}s` : '?';
            const denials = result.permission_denials_count ?? 0;
            const errored = result.is_error === true ? 'yes' : 'no';
            await core.summary
              .addHeading('Claude @claude mention — run cost', 3)
              .addTable([
                [{ data: 'Cost (USD)', header: true }, { data: 'Turns', header: true }, { data: 'Duration', header: true }, { data: 'Denials', header: true }, { data: 'Errored', header: true }],
                [cost, String(turns), durS, String(denials), errored],
              ])
              .write();
            core.notice(`Cost ${cost} · ${turns} turns · ${durS} · ${denials} denials`, { title: 'Claude mention cost' });
